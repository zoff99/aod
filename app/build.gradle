plugins {
    id 'com.android.application'
}

// Fails the build if any notification title or message text could be read.
apply from: "$rootDir/gradle/privacy-guard.gradle"
apply from: "$rootDir/gradle/ascii-guard.gradle"

def getGitHash = { ->
    try
    {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--verify', '--short=8', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    }
    catch (Exception ignored)
    {
        return "????????"
    }
}

android {
    namespace 'com.zoffcc.applications.aod'
    compileSdk 34

    buildFeatures {
        buildConfig = true
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs / bundles.
        includeInApk = false
        includeInBundle = false
    }

    defaultConfig {
        applicationId "com.zoffcc.applications.aod"
        minSdk 28          // Android 9: DisplayCutout, GLOBAL_ACTION_LOCK_SCREEN, setShowWhenLocked
        targetSdk 34
        versionCode 10100
        versionName "1.1.0"

        vectorDrawables.useSupportLibrary = true
        buildConfigField "String", "GitHash", "\"${getGitHash()}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // The androidTest APK is minified too (it follows the tested build
        // type), but it does not inherit the app's rule files. Without its own
        // rules R8 fails on optional references inside AndroidX Test, and a
        // test harness must never be shrunk or renamed anyway.
        testProguardFiles 'test-proguard-rules.pro'
    }

    buildTypes {
        // Shrinking is on in both variants on purpose: it drops the unused
        // AndroidX notification helpers, so the code that could read a
        // notification title or message body is not in the APK at all.
        // No obfuscation, no optimisation - see app/proguard-rules.pro.
        release {
            crunchPngs false
            minifyEnabled true
            shrinkResources false
            proguardFiles 'proguard-rules.pro'
        }
        debug {
            crunchPngs false
            minifyEnabled true
            shrinkResources false
            proguardFiles 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // needed by DocumentExporter/DocumentImporter (SAF helpers)
    implementation 'androidx.documentfile:documentfile:1.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

// Helper: print the exact runtime classpath (used by low-memory manual builds)
tasks.register('printRuntimeClasspath') {
    doLast {
        println "CPSTART:" + configurations.debugRuntimeClasspath.asPath + ":CPEND"
    }
}
